<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Scimplify Tungsten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: KPI band -> portfolio table (also the picker) -> one material, split into tabs: recycling play, supply and demand, opportunities. */
:root{
  --bg:#EEF1F2; --surface:#FFFFFF; --sunk:#F5F7F8; --line:#D8DEE2; --fg:#13191D; --muted:#5A6670;
  --accent:#1F5F78; --accent-soft:#DDEAF0; --track:#E4E9EC;
  --mine:#5B6B7A; --scrap:#2E8B6E; --byp:#A3ADB5;
  --yes:#2E8B6E; --yes-bg:#DDF1E7; --yes-fg:#1B5A45;
  --mg:#C48A1A; --mg-bg:#F8ECD0; --mg-fg:#7A5208;
  --no:#B5524A; --no-bg:#F6DFDC; --no-fg:#88302A;
  --ink:#13191D; --ink-fg:#EEF1F2; --ink-muted:#9FB0BB;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1417; --surface:#162026; --sunk:#121A1F; --line:#2A363E; --fg:#E5EBEE; --muted:#9AA8B1;
  --accent:#7DBAD3; --accent-soft:#1B3441; --track:#25313A;
  --mine:#8E9EAD; --scrap:#5CC3A1; --byp:#5E6A73;
  --yes:#5CC3A1; --yes-bg:#173A2E; --yes-fg:#A6E3CC;
  --mg:#E3AE4B; --mg-bg:#3B2E12; --mg-fg:#F2CF86;
  --no:#E08A82; --no-bg:#3F2220; --no-fg:#F4B3AC;
  --ink:#E5EBEE; --ink-fg:#0E1417; --ink-muted:#4C5A63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1417; --surface:#162026; --sunk:#121A1F; --line:#2A363E; --fg:#E5EBEE; --muted:#9AA8B1;
  --accent:#7DBAD3; --accent-soft:#1B3441; --track:#25313A;
  --mine:#8E9EAD; --scrap:#5CC3A1; --byp:#5E6A73;
  --yes:#5CC3A1; --yes-bg:#173A2E; --yes-fg:#A6E3CC;
  --mg:#E3AE4B; --mg-bg:#3B2E12; --mg-fg:#F2CF86;
  --no:#E08A82; --no-bg:#3F2220; --no-fg:#F4B3AC;
  --ink:#E5EBEE; --ink-fg:#0E1417; --ink-muted:#4C5A63; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:14px;line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}

.top{display:flex;flex-direction:column;gap:6px}
.top h1{font-size:clamp(28px,4.4vw,42px);font-weight:800;letter-spacing:-.02em}
.top p{margin:0;color:var(--muted);font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));background:var(--ink);color:var(--ink-fg);border-radius:16px;overflow:hidden}
.kpi{padding:18px 22px;display:flex;flex-direction:column;gap:2px;border-right:1px solid color-mix(in srgb,var(--ink-fg) 12%,transparent)}
.kpi:last-child{border-right:0}
.kpi b{font-size:30px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--ink-muted)}

.tbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table.port{width:100%;min-width:760px;border-collapse:collapse}
.port th{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.port td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}
.port tr:last-child td{border-bottom:0}
.port tbody tr{cursor:pointer;transition:background .15s}
.port tbody tr:hover{background:var(--sunk)}
.port tbody tr.on{background:var(--accent-soft)}
.port tbody tr.on td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.mat-btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px}
.mat-btn:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.el{width:42px;height:42px;flex:none;border:1.5px solid var(--fg);border-radius:4px;display:flex;flex-direction:column;justify-content:space-between;padding:2px 4px;background:var(--surface)}
.el .z{font-family:var(--mono);font-size:8px;line-height:1}
.el .sym{font-weight:800;font-size:17px;line-height:1;text-align:center}
.el .nm{font-family:var(--mono);font-size:6px;line-height:1;text-align:center;text-transform:uppercase}
.mat-btn b{font-size:14.5px}
.mat-btn small{display:block;font-size:11.5px;color:var(--muted)}
.rbar{display:flex;align-items:center;gap:10px}
.rbar .trk{position:relative;flex:1;height:10px;border-radius:5px;background:var(--track);min-width:110px}
.rbar .lo{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.rbar .hi{position:absolute;top:0;bottom:0;border-radius:0 5px 5px 0;background:var(--accent);opacity:.35}
.rbar .v{font-family:var(--mono);font-size:12.5px;font-weight:600;min-width:84px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.03em;padding:3px 9px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.v-YES,.v-PURSUE{background:var(--yes-bg);color:var(--yes-fg)}
.v-MARGINAL,.v-DILIGENCE{background:var(--mg-bg);color:var(--mg-fg)}
.v-NO,.v-TRADE{background:var(--no-bg);color:var(--no-fg)}

.mview{display:flex;flex-direction:column;gap:16px;scroll-margin-top:12px}
.mhead{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between}
.mhead .l{display:flex;flex-direction:column;gap:6px;min-width:0}
.mhead h2{font-size:32px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mhead p{margin:0;font-size:15.5px;color:var(--muted);max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;min-width:130px}
.chip b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.chip span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.tab:hover{color:var(--fg)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--scrap);margin-right:7px;vertical-align:1px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
.ph h3{font-size:17px;font-weight:800}
.ph .hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}

.line{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-top:6px}
.line::before{content:"";position:absolute;left:12.5%;right:12.5%;top:44px;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--scrap) 0 10px,transparent 10px 18px);background-size:18px 4px;animation:flow 1.2s linear infinite;opacity:.8}
@keyframes flow{to{background-position:18px 0}}
.stn{all:unset;cursor:pointer;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 4px 6px}
.stn .ring{width:80px;height:80px;border-radius:50%;background:var(--surface);border:2.5px solid var(--scrap);display:flex;align-items:center;justify-content:center;color:var(--scrap);transition:transform .2s, background .2s, color .2s}
.stn .ring svg{width:36px;height:36px}
.stn:hover .ring{transform:scale(1.05)}
.stn[aria-pressed="true"] .ring{background:var(--scrap);color:var(--surface);box-shadow:0 0 0 6px var(--yes-bg)}
.stn:focus-visible .ring{outline:2px solid var(--accent);outline-offset:4px}
.stn b{font-size:14px;line-height:1.25}
.stn .out{font-family:var(--mono);font-size:11px;color:var(--muted)}
.stn .live{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--yes-fg);background:var(--yes-bg);padding:2px 8px;border-radius:999px}
.stn.next .ring{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.stn.next[aria-pressed="true"] .ring{background:var(--muted);color:var(--surface);box-shadow:0 0 0 6px var(--track)}
.stn.next .live{background:var(--track);color:var(--muted)}
.zinc{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding-left:calc(12.5% - 40px)}
.zinc .stn{flex-direction:row;text-align:left;gap:12px}
.zinc .stn .ring{width:52px;height:52px}
.zinc .stn .ring svg{width:24px;height:24px}
.zinc .lab{font-family:var(--mono);font-size:11px;color:var(--muted)}
@media (max-width:640px){.line{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px}.line::before{display:none}.zinc{padding-left:0}}
@media (prefers-reduced-motion: reduce){.line::before{animation:none}.stn .ring{transition:none}}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;background:var(--sunk);border-radius:12px;padding:16px}
.detail h4{font-size:18px;font-weight:800}
.morph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mchip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:5px 11px 5px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.mchip i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);flex:none}
.mchip.o{font-weight:700}
.steps{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:center;font-size:13px}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:10.5px;font-weight:600;width:20px;height:20px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none}
.vbig{font-size:28px;font-weight:800;color:var(--yes-fg);font-variant-numeric:tabular-nums}
.role{font-size:13px}

.wf{width:100%;height:auto;display:block}
.wf text{font-family:var(--display);font-size:12px;fill:var(--fg)}
.wf text.m{fill:var(--muted);font-family:var(--mono);font-size:10.5px}

.sl{display:flex;flex-direction:column;gap:6px}
.sl label{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.sl label output{font-family:var(--mono);color:var(--yes-fg)}
input[type=range]{width:100%;accent-color:var(--scrap);height:28px}
.mout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mout div{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.mout b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.mout b.g{color:var(--yes-fg)}
.mout span{font-size:11.5px;color:var(--muted)}
.stack{display:flex;height:26px;border-radius:7px;overflow:hidden;gap:2px;background:var(--track)}
.stack span{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:600;color:#fff;transition:width .25s;white-space:nowrap;overflow:hidden}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.gauge{position:relative;height:12px;border-radius:6px;background:var(--track)}
.gauge .f{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--scrap);transition:width .25s}
.gauge .t{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg)}
.gscale{position:relative;height:16px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.gscale span{position:absolute;top:2px;transform:translateX(-50%)}
.gscale span:first-child{transform:none}.gscale span:last-child{transform:translateX(-100%)}
.owns{display:flex;flex-wrap:wrap;gap:8px}
.owns span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:6px 12px 6px 9px;border-radius:999px;background:var(--ink);color:var(--ink-fg)}
.owns svg{width:15px;height:15px;color:var(--scrap)}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.fact{border-radius:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;border-left:4px solid var(--mine)}
.fact.s{border-left-color:var(--scrap)}.fact.i{border-left-color:var(--accent)}
.fact b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.fact small{font-size:11.5px;color:var(--muted)}
.sankey-box{overflow-x:auto}
.sankey{display:block;min-width:820px;width:100%;height:auto}
.sankey text{fill:var(--fg);font-family:var(--display);font-size:12.5px}
.sankey text.m{fill:var(--muted);font-family:var(--mono);font-size:10.5px}
.sankey text.col{fill:var(--muted);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em}
.sankey path.lk{fill-opacity:.32;transition:fill-opacity .15s}
.sankey path.lk:hover,.sankey.focus path.lk.on{fill-opacity:.62}
.sankey.focus path.lk{fill-opacity:.08}
.sankey g.nd{cursor:pointer}
.sankey rect.route{fill:var(--surface);stroke-width:1.5}
.sankey g.nd:focus{outline:none}
.sankey g.nd:focus-visible rect{stroke:var(--accent);stroke-width:3}
.ltable{width:100%;border-collapse:collapse;font-size:13.5px}
.ltable th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.ltable td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.ltable tr:last-child td{border-bottom:0}

.opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.opp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.opp .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.opp h4{font-size:15.5px;font-weight:800;line-height:1.3}
.opp p{margin:0;font-size:13px;color:var(--muted)}
.opp .g{margin-top:auto;font-size:13px;font-weight:700;color:var(--yes-fg)}
.mtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.mt b{font-size:28px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.mt small{font-size:11.5px;color:var(--muted)}
.mt.hl{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.mt.hl .eyebrow,.mt.hl small{color:var(--ink-muted)}
.mt.gn{background:var(--yes-bg);border-color:var(--scrap)}
.mt.gn b{color:var(--yes-fg)}
.ph h3 .sn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--fg);color:var(--surface);font-family:var(--mono);font-size:11px;margin-right:10px;vertical-align:2px}
.tscroll{overflow-x:auto}
table.pk{width:100%;min-width:900px;border-collapse:collapse;font-size:13px}
.pk th{text-align:left;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.pk td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.pk tr:last-child td{border-bottom:0}
.pk tbody tr{cursor:pointer;transition:background .15s}
.pk tbody tr:hover,.pk tbody tr.on{background:var(--accent-soft)}
.pk td small{color:var(--muted);font-size:11px;white-space:nowrap}
.pk td.mono{white-space:nowrap}
.src{display:flex;align-items:center;gap:8px}
.cline{font-size:11.5px;color:var(--yes-fg);margin-top:4px;line-height:1.4}
.src i{width:12px;height:12px;border-radius:3px;flex:none}
.sbar{margin-top:6px;height:6px;border-radius:3px;background:var(--track);width:140px}
.sbar span{display:block;height:100%;border-radius:3px}
.chev{display:flex;flex-wrap:wrap;gap:4px}
.cv{flex:1 1 140px;min-width:0;position:relative;padding:14px 22px 14px 26px;background:color-mix(in srgb,var(--scrap) calc(12% + var(--i) * 12%),var(--surface));clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);display:flex;flex-direction:column;gap:2px}
.cv:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);padding-left:16px}
.cv b{font-size:14px;font-weight:800}
.cv span{font-size:11.5px;color:var(--fg);opacity:.8}
@media (max-width:640px){.cv,.cv:first-child{clip-path:none;border-radius:8px;flex-basis:100%}}
.regs{display:flex;flex-direction:column;gap:10px}
.rg{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.rt{height:12px;border-radius:6px;background:var(--track);overflow:hidden}
.rt span{display:block;height:100%;background:var(--accent);border-radius:6px}
.rg b{text-align:right}
.uses{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.use{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.uh{display:flex;justify-content:space-between;align-items:center}
.uic{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.uic svg{width:22px;height:22px}
.ushare{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.use h4{font-size:15px;font-weight:800}
.use p{margin:0;font-size:12.5px;color:var(--muted)}
.forms{display:flex;flex-wrap:wrap;gap:4px}
.forms span{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.who{display:flex;flex-direction:column;gap:5px;margin-top:auto;border-top:1px dashed var(--line);padding-top:8px}
.who div{display:flex;flex-wrap:wrap;gap:4px}
.who div span{font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
table.co{min-width:760px}
.cobadge{display:flex;align-items:center;gap:10px}
.mono-b{width:36px;height:36px;flex:none;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;letter-spacing:.02em;background:var(--accent-soft);color:var(--accent);border:1px solid var(--line)}
.co tbody tr{cursor:default}
.segs{display:flex;flex-wrap:wrap;gap:4px}
.segs span{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.gtabs{display:flex;flex-wrap:wrap;gap:6px}

  const nodes = [['Tool users','parts'],['Used tools and sludge','scrapS'],['Collect and grade','conc'],['Chemical recycling','apt'],['Tungsten oxide','oxide'],['W and WC powder','powder']];
  const pts = nodes.map((n,i) => { const a = -Math.PI/2 + i*2*Math.PI/nodes.length; return [cx + r*Math.cos(a), cy + r*Math.sin(a), n, a]; });
  const dots = [0,1,2,3,4].map(i => `<circle class="ptc" r="5" fill="#2E8B6E"><animateMotion dur="10s" repeatCount="indefinite" begin="-${i*2}s"><mpath href="#ring"/></animateMotion></circle>`).join('');
  return `<svg viewBox="-40 0 480 400" class="loopsvg" role="img" aria-label="Closed loop: tools are used, collected as scrap, recycled into powder and made into new tools">
    <circle id="ring" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2E8B6E" stroke-width="3" stroke-dasharray="6 6" opacity=".55"/>
    <path id="ringp" d="M${cx},${cy-r} a${r},${r} 0 1,1 -0.01,0" fill="none"/>
    ${dots.replace(/#ring"/g,'#ringp"')}
    <circle cx="${cx}" cy="${cy}" r="78" class="lc"/>
    <text x="${cx}" y="${cy-14}" text-anchor="middle" class="lt1">Closed loop</text>
    <text x="${cx}" y="${cy+8}" text-anchor="middle" class="lt2">Scrap back to</text>
    <text x="${cx}" y="${cy+26}" text-anchor="middle" class="lt2">virgin-grade product</text>
    ${pts.map(([x,y,n,a],i) => { const c = Math.cos(a), sn = Math.sin(a), tx = c*40, ty = sn*44 + 4; const anc = Math.abs(c) < 0.2 ? 'middle' : (c > 0 ? 'start' : 'end'); return `<g transform="translate(${x},${y})"><circle r="30" class="ln ${i>=2?'sc':''}"/><g transform="scale(.8)">${SYM[n[1]]}</g><text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anc}" class="lnl">${esc(n[0])}</text></g>`; }).join('')}
  </svg>`;
}

function waterfall(wf){
  const W = 560, H = 330, pad = 20, step = (W - pad*2) / wf.length, bw = step * 0.62, base = H - 40, sc = (H - 80) / 100;
  let acc = 0, out = `<line x1="${pad}" x2="${W-pad}" y1="${base}" y2="${base}" stroke="var(--line)"/>`;
  wf.forEach((d, i) => {
    const x = pad + i*step + (step - bw)/2;
    let y0, h, fill, txt;
    if (d[2] === 'base'){ h = d[1]*sc; y0 = base - h; acc = d[1]; fill = 'var(--mine)'; txt = d[1]+'%'; }
    else if (d[2] === 'total'){ h = d[1]*sc; y0 = base - h; fill = 'var(--fg)'; txt = d[1]+'%'; }
    else { h = d[1]*sc; y0 = base - (acc + d[1])*sc; acc += d[1]; fill = 'var(--scrap)'; txt = '+'+d[1]+'%'; }
    out += `<rect x="${x}" y="${y0}" width="${bw}" height="${Math.max(h,2)}" rx="3" fill="${fill}"/>`;
    if (i < wf.length - 1){ const ty = base - acc*sc; out += `<line x1="${x+bw}" x2="${x+step}" y1="${ty}" y2="${ty}" stroke="var(--muted)" stroke-dasharray="3 3"/>`; }
    out += `<text x="${x+bw/2}" y="${y0-7}" text-anchor="middle" font-weight="700">${txt}</text>`;
    out += `<text class="m" x="${x+bw/2}" y="${base+18}" text-anchor="middle">${esc(d[0])}</text>`;
  });
  return `<svg class="wf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Value build-up from scrap feed to finished product">${out}</svg>`;
}
function wireModel(m){
  const R = m.recycle.model, el = document.getElementById('share'); if (!el) return;
  const upd = () => {
    const s = +el.value/100, rec = R.pipeline*s, buy = R.pipeline - rec, mar = rec*R.rec + buy*R.base, bl = mar/R.pipeline, extra = mar - R.pipeline*R.base;
    document.getElementById('shareOut').textContent = el.value + '%';
    document.getElementById('mstack').innerHTML = `<span style="width:${(1-s)*100}%;background:var(--mine)">${buy>=3?'$'+buy.toFixed(0)+'M':''}</span><span style="width:${s*100}%;background:var(--scrap)">${rec>=3?'$'+rec.toFixed(0)+'M':''}</span>`;
    document.getElementById('mout').innerHTML = `<div><b>$${rec.toFixed(1)}M</b><span>Revenue on recycled feed</span></div><div><b class="g">${(bl*100).toFixed(1)}%</b><span>Blended margin (today 15%)</span></div><div><b>$${mar.toFixed(1)}M</b><span>Total margin a year</span></div><div><b class="g">+$${extra.toFixed(1)}M</b><span>Extra margin vs today</span></div>`;
    document.getElementById('gf').style.width = (bl/0.3*100) + '%';
  };
  el.addEventListener('input', upd); upd();
}

function sankey(m){
  const mk = MARKET[m.id];
  const W = 1080, top = 34, bot = 10, gap = 10, k = 3.4;
  const sum = (arr, key, idx) => arr.filter(f => f[idx]===key).reduce((a,f)=>a+f[2],0);
  let mi = 0, si = 0;
  const srcItems = mk.pockets.map(p => ({id:p[0], label:p[10] || p[1], sub:p[3]+'% · '+p[4], color: p[8]==='scrap' ? SCRAP_SHADES[Math.min(si++, SCRAP_SHADES.length-1)] : SRC_SHADES[Math.min(mi++, SRC_SHADES.length-1)], v:sum(mk.sr, p[0], 0)}));
  const hubItems = mk.hubs.map(h => ({id:h[0], label:h[1], sub:h[2], color:h[3], det:h[4], v:Math.max(sum(mk.sr, h[0], 1), sum(mk.rd, h[0], 0))}));
  const demItems = mk.dem.map(d => ({id:d[0], label:d[1], v:sum(mk.rd, d[0], 1)}));
  const height = (items, minH) => items.reduce((a,it)=>a+Math.max(it.v*k, minH),0) + gap*(items.length-1);
  const H = Math.max(height(srcItems, 30), height(hubItems, 60), height(demItems, 30)) + top + bot + 10;
  const col = (items, x, w, minH) => { const hs = items.map(it => Math.max(it.v*k, it.minH || minH)); const total = hs.reduce((a,b)=>a+b,0) + gap*(items.length-1); let y = top + (H-top-bot-total)/2;
    items.forEach((it,i) => { it.x = x; it.w = w; it.y = y; it.h = hs[i]; it.inOff = it.outOff = (hs[i]-it.v*k)/2; y += hs[i] + gap; }); return items; };
  hubItems.forEach(h => { if (h.det) h.minH = 108; });
  const S = col(srcItems, 210, 14, 30), R = col(hubItems, 430, 250, 60), D = col(demItems, 900, 14, 30);
  const by = id => [...S,...R,...D].find(n => n.id === id);
  const band = (a, b, v, color) => { const t = v*k, x0 = a.x+a.w, x1 = b.x, y0 = a.y+a.outOff, y1 = b.y+b.inOff; a.outOff += t; b.inOff += t; const c = (x1-x0)*.5;

function wireSankey(){

    const keep = new Set([id]);
    [true,false].forEach(fwd => { let fr = [id]; while (fr.length){ const nx = []; paths.forEach(p => { const a = fwd?p.dataset.a:p.dataset.b, b = fwd?p.dataset.b:p.dataset.a; if (fr.includes(a) && !keep.has(b)){ keep.add(b); nx.push(b);} }); fr = nx; } });

    document.querySelector(`.pk tr[data-src="${id}"]`)?.classList.add('on'); };
  skFocus = focus;
  svg.querySelectorAll('g.nd').forEach(g => { g.addEventListener('mouseenter', () => focus(g.dataset.id)); g.addEventListener('focus', () => focus(g.dataset.id)); g.addEventListener('click', () => focus(g.dataset.id)); });
  svg.addEventListener('mouseleave', () => focus(null));
  document.querySelectorAll('.pk tbody tr').forEach(r => { r.addEventListener('mouseenter', () => focus(r.dataset.src)); r.addEventListener('click', () => focus(r.dataset.src)); });
  document.querySelector('.pk')?.addEventListener('mouseleave', () => focus(null));
}

    <div class="gtabs" role="tablist">${[['all','All sites']].concat(Object.entries(STG_LBL)).map(([k,l]) => `<button type="button" class="gtab" data-gfilter="${k}" style="--c:${STG_COL[k]||'var(--fg)'}"><i></i>${l}</button>`).join('')}</div>
    <div class="mapbox">
      <svg class="wmap" viewBox="${vb}" role="img" aria-label="World map of tungsten mines and processing sites">
        <path d="${MAPDATA.land}" class="land"/>
        <path d="${MAPDATA.mine}" class="mland"/>
        ${MAPDATA.pins.map((p,i) => `<g class="pin" data-i="${i}" tabindex="0" transform="translate(${p[1]},${p[2]})"><circle class="pulse" r="9"/><circle class="dot" r="5"/><title>${esc(p[0])}</title></g>`).join('')}
      </svg>
      <div class="pininfo" id="pininfo"></div>
    </div>
    <div class="glegend"><span><i class="ml"></i>Tungsten-mining countries</span><span>Pins show mines, plants and recyclers</span></div>
    <div class="gflow"><svg viewBox="0 0 1000 205" class="gproc" role="img" aria-label="Animated tungsten process from ore to carbide parts">
      <line x1="${x0}" y1="70" x2="${x1}" y2="70" class="gline"/>${loop}${parts}${nodes}</svg></div>
    <div class="gcard" id="gcard"></div>
  </div>`;
}
function wireGeo(){
  const box = document.querySelector('.wmap'); if (!box) return;
  const setFilter = k => {
    state.gf = k;
    document.querySelectorAll('.gtab').forEach(b => b.setAttribute('aria-pressed', b.dataset.gfilter === k));
    box.querySelectorAll('.pin').forEach(g => { const p = MAPDATA.pins[+g.dataset.i]; const on = k === 'all' || p[3].includes(k); const c = STG_COL[k === 'all' ? p[3][0] : k];
      g.classList.toggle('off', !on); g.style.setProperty('--c', c); });
  };
  const setStage = s => {
    state.gs = s;
    const st = GSTAGES.find(x => x[0] === s);
    document.querySelectorAll('.gnode').forEach(g => g.classList.toggle('on', g.dataset.stage === s));
    document.getElementById('gcard').innerHTML = `<div class="gc-l"><span class="gic" style="background:${STG_COL[st[2]]}"><svg viewBox="-22 -22 44 44">${SYM[s]}</svg></span><div><span class="eyebrow">${esc(STG_LBL[st[2]])}</span><h4>${esc(st[1])}</h4></div></div><div><span class="eyebrow">What happens</span><p>${esc(st[3])}</p></div><div><span class="eyebrow">Where</span><p><b>${esc(st[4])}.</b> ${esc(st[5])}</p></div>`;
    setFilter(st[2]);
  };
  const showPin = i => { const p = MAPDATA.pins[i]; document.getElementById('pininfo').innerHTML = `<b>${esc(p[0])}</b><div class="pst">${p[3].map(k => `<span style="--c:${STG_COL[k]}">${STG_LBL[k]}</span>`).join('')}</div><p>${esc(p[4])}</p>`; document.getElementById('pininfo').classList.add('show'); };
  document.querySelectorAll('.gtab').forEach(b => b.addEventListener('click', () => setFilter(b.dataset.gfilter)));
  document.querySelectorAll('.gnode').forEach(g => { g.addEventListener('click', () => setStage(g.dataset.stage)); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); setStage(g.dataset.stage); } }); });
  box.querySelectorAll('.pin').forEach(g => { g.addEventListener('mouseenter', () => showPin(+g.dataset.i)); g.addEventListener('focus', () => showPin(+g.dataset.i)); g.addEventListener('click', () => showPin(+g.dataset.i)); });
  setStage(state.gs || 'ore');
}

function marketPanel(m){
  const mk = MARKET[m.id]; if (!mk) return '';
  let mi = 0, si = 0;
  const shade = p => p[8]==='scrap' ? SCRAP_SHADES[Math.min(si++, SCRAP_SHADES.length-1)] : SRC_SHADES[Math.min(mi++, SRC_SHADES.length-1)];
  const maxR = Math.max(...mk.regions.map(r => r[1]));
  return `
  <div class="mtiles">${mk.mkt.map((t,i) => `<div class="mt ${i===0?'hl':''}"><span class="eyebrow">${esc(t[1])}</span><b>${esc(t[0])}</b><small>${esc(t[2])}</small></div>`).join('')}</div>

  <div class="panel">
    <div class="ph"><h3><span class="sn">1</span>Where supply comes from</h3><span class="hint">Hover a row to trace it in the flow below [E]</span></div>
    <div class="tscroll"><table class="pk"><thead><tr><th>Source</th><th>Volume a year</th><th>Value</th><th>Processing</th><th>Goes to</th><th>Used for</th></tr></thead><tbody>
      ${mk.pockets.map(p => `<tr data-src="${p[0]}"><td><div class="src"><i style="background:${shade(p)}"></i><b>${esc(p[1])}</b></div>${p[9] ? `<div class="cline">${esc(p[9])}</div>` : ''}<div class="sbar"><span style="width:${p[3]}%;background:${p[8]==='scrap'?'var(--scrap)':'var(--mine)'}"></span></div></td><td class="mono"><b>${esc(p[2])}</b><br><small>${p[3]}% of supply</small></td><td class="mono"><b>${esc(p[4])}</b></td><td>${esc(p[5])}</td><td>${esc(p[6])}</td><td>${esc(p[7])}</td></tr>`).join('')}
    </tbody></table></div>
  </div>

  <div class="panel">
    <div class="ph"><h3><span class="sn">2</span>How it flows: mine → processing → use</h3><span class="hint">Band width = share of world volume [E]</span></div>
    <div class="sankey-box">${sankey(m)}</div>
  </div>

  ${mk.growth ? growthBlock(mk) : ''}
  ${mk.uses ? usesBlock(mk) : ''}
  ${m.id === 'tungsten' ? geoPanel(6) : `<div class="panel">
    <div class="ph"><h3><span class="sn">${mk.uses ? 5 : 3}</span>The processing chain</h3><span class="hint">Each step adds value</span></div>
    <div class="chev">${mk.chain.map((c,i) => `<div class="cv" style="--i:${i}"><b>${esc(c[0])}</b><span>${esc(c[1])}</span></div>`).join('')}</div>
  </div>`}

  <div class="grid2">
    <div class="panel"><div class="ph"><h3><span class="sn">${mk.uses ? 7 : 4}</span>Where it is consumed</h3><span class="hint">Share of world demand [E]</span></div>
      <div class="regs">${mk.regions.map(r => `<div class="rg"><span>${esc(r[0])}</span><div class="rt"><span style="width:${r[1]/maxR*100}%"></span></div><b class="mono">${r[1]}%</b></div>`).join('')}</div>
    </div>
    <div class="panel"><div class="ph"><h3>India and global</h3></div>
      <table class="ltable"><thead><tr><th></th><th>India</th><th>Global</th></tr></thead><tbody>${m.land.map(r => `<tr><td class="eyebrow">${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table>
    </div>
  </div>`;
}

function potentialBlock(m){
  const t = [
    [m.revL, 'Revenue potential a year', m.margin === 'TBC' ? 'Guideline until pipeline is shared' : 'Current pipeline'],
    [m.margin, 'Margin', m.margin === 'TBC' ? 'To be confirmed with pipeline' : 'On the pipeline today'],
    [m.mabs || 'TBC', 'Margin a year', m.mabs ? 'At current margin' : 'Once margin is confirmed'],
    [m.gain, 'Extra margin from our value add', 'A year, on top of today [E]']
  ];
  return `<div class="mtiles">${t.map((x,i) => `<div class="mt ${i===0?'hl':''} ${i===3?'gn':''}"><span class="eyebrow">${esc(x[1])}</span><b>${esc(x[0])}</b><small>${esc(x[2])}</small></div>`).join('')}</div>`;
}
function oppPanel(m){
  return `<div class="opps">${m.opps.map(o => `<article class="opp"><div class="h"><h4>${esc(o[0])}</h4><span class="pill v-${o[1]}">${lab(o[1])}</span></div><p>${esc(o[2])}</p><span class="g">${esc(o[3])}</span></article>`).join('')}</div>`;
}

function render(){
  const m = MATERIALS.find(x => x.id === state.id) || MATERIALS[0];
  const tabs = [['market','Supply and demand'],['value','Our value add']].concat(m.recycle ? [['opps','Next opportunities']] : []);
  if (!tabs.some(t => t[0] === state.tab)) state.tab = tabs[0][0];
  renderTop();
  view.innerHTML = `
  <div class="tabs" role="tablist">${tabs.map(t => `<button type="button" class="tab" role="tab" data-tab="${t[0]}" aria-selected="${t[0]===state.tab}">${t[0]==='value'?'<span class="dot"></span>':''}${t[1]}</button>`).join('')}</div>
  <div role="tabpanel" style="display:flex;flex-direction:column;gap:16px">${state.tab==='value' ? potentialBlock(m) + (m.recycle ? recyclePanel(m) : oppPanel(m)) : state.tab==='market' ? marketPanel(m) : oppPanel(m)}</div>`;
  if (state.tab === 'market'){ wireSankey(); wireGeo(); }
  if (state.tab === 'value' && m.recycle) wireModel(m);
}

document.addEventListener('click', e => {
  const row = e.target.closest('#rows tr');
  if (row){ const id = row.dataset.id; if (location.hash !== '#'+id) location.hash = id; else { state.id = id; render(); } return; }
  const t = e.target.closest('.tab'); if (t){ state.tab = t.dataset.tab; render(); document.querySelector(`.tab[data-tab="${state.tab}"]`)?.focus(); return; }
  const s = e.target.closest('.stn'); if (s){ state.stn = s.dataset.stn === 'z' ? 'z' : +s.dataset.stn; render(); document.querySelector(`.stn[data-stn="${s.dataset.stn}"]`)?.focus(); }
});
const fromHash = () => { const id = (location.hash||'').slice(1); if (MATERIALS.some(m => m.id === id) && id !== state.id){ state.id = id; state.tab = null; } render(); };
window.addEventListener('hashchange', () => { fromHash(); view.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); });
fromHash();
</script>

</body>
</html>
